%YAML 1.3
---
- Key: [Mute Microphone, pressed]
- KeyPress:
  - XF86_AudioMicMute
  - click
...
---
- Key: [Voice Dictation, pressed]
- KeyPress:
  - XF86_AudioRecord
  - depress
...
---
- Key: [Voice Dictation, released]
- KeyPress:
  - XF86_AudioRecord
  - release
...
---
- Key: [Backlight Down, pressed]
- KeyPress:
  - XF86_MonBrightnessDown
  - click
...
---
- Key: [Backlight Up, pressed]
- KeyPress:
  - XF86_MonBrightnessUp
  - click
...
