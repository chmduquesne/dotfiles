# Source of truth lives in the dotfiles; install with
#   sudo install -D -m 644 ~/.config/egpu/ollama-egpu-dropin.conf /etc/systemd/system/ollama.service.d/10-egpu.conf
#   sudo systemctl daemon-reload
# Undo:
#   sudo rm /etc/systemd/system/ollama.service.d/10-egpu.conf && sudo systemctl daemon-reload
#
# Don't let ollama start until the eGPU is usable, so it never falls back to CPU-only.
# The udev "add" event fires before the nvidia driver has finished initializing the GPU.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do /usr/bin/nvidia-smi -L >/dev/null 2>&1 && exit 0; sleep 1; done; echo "eGPU not ready after 60s" >&2; exit 1'
TimeoutStartSec=90
# After the GPU is pulled, llama-server may not exit cleanly; don't wait the default 90s.
TimeoutStopSec=15
