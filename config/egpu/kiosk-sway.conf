# Minimal sway "kiosk" for the eGPU: one program (Steam, a game, any graphical
# program) on the eGPU's HDMI output. Started by `egpu-kiosk`, which sets KIOSK_CMD.
#
# Why sway and not cage: sway implements pointer constraints, which games use to
# capture the mouse; cage 0.2.0 does not.
#
# KIOSK_CMD is the program to run; when it exits, this sway exits too.

xwayland enable
default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse yes
focus_on_window_activation focus

# No bar, no idle/screen-blanking, no wallpaper: nothing else should touch the output.
output * bg #000000 solid_color

# The way out if the program is stuck: Alt+Esc quits this sway. egpu-kiosk then shuts
# Steam down and switches the monitor back to the dock.
bindsym Mod1+Escape exit
bindsym Mod1+Shift+q kill

# Dialogs and splash windows should not be stretched over the whole output.
for_window [window_role="pop-up"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="splash"] floating enable

exec sh -c "$KIOSK_CMD; swaymsg exit"
